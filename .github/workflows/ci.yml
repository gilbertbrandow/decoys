name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint
        env:
          RUFF_OUTPUT_FORMAT: github  # inline annotations on the PR diff

      - name: Type check
        run: make typecheck

      - name: Tests
        run: make test
